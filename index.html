<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        :root {
            --bg-color: #0b162c;
            --text-main: #ffffff;
            --text-muted: #9ea1a7;
            --link-color: #72a1ed;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }

        /* Top Header Section */
        .header h1 {
            font-family: 'Linux Libertine', 'Georgia', serif;
            font-size: 3rem;
            margin-bottom: 0;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .header p {
            font-style: italic;
            font-size: 1.2rem;
            margin-top: 5px;
            color: var(--text-main);
        }

        /* Central Layout */
        .central-wrapper {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }


        /* Language Columns */
        .lang-column {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .left { text-align: right; }
        .right { text-align: left; }

        /* Individual Language Items */
        .lang-item {
            text-decoration: none;
            transition: transform 0.2s;
        }

        .lang-item:hover {
            transform: scale(1.05);
        }

        .lang-name {
            display: block;
            color: var(--link-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .article-count {
            display: block;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2px;
        }

    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>INTERNET TERMINOLOGIES</h1>
            <p>A Brief Dive into Some Terminologies</p>
        </header>

        <main class="central-wrapper">
            <div class="lang-column left">
                <a href="WWW.html" class="lang-item">
                    <span class="lang-name">World Wide Web</span>
                    
                </a>
                <a href="TCP.html" class="lang-item">
                    <span class="lang-name">TCP/IP</span>
                    
                </a>
                <a href="browser.html" class="lang-item">
                    <span class="lang-name">Web Browsers</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">URLs</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">DNS</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Web 3.0</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Web 4.0</span>
                </a>    
                <a href="#" class="lang-item">
                    <span class="lang-name">-</span>
                </a>     
            </div>

            <div class="globe-container">
                    <img src="images/globe.png" width="300">
             </div>

            <div class="lang-column right">
                <a href="#" class="lang-item">
                    <span class="lang-name">HTTP</span>
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Intranet</span>
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Extranet</span>
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Multitier Architecture</span>
                   
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">FTP</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">HTML</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Web 1.0</span>
                    
                </a>
                <a href="#" class="lang-item">
                    <span class="lang-name">Web 2.0</span>
                    
                </a>
            </div>
        </main>
    </div>

</body>
</html>
